    <text x="70" y="218" fill="#c4cdd2" font-size="19" font-weight="500" letter-spacing="3">AI SYSTEMS ARCHITECT / MACHINE INTERLOCUTOR</text>

    <text x="70" y="278" fill="#a8b0b7" font-size="20">
      <tspan x="70" dy="0">Working at the interpretive boundary between</tspan>
      <tspan x="70" dy="30">machine intelligence and human judgment.</tspan>
    </text>

    <text x="68" y="454" fill="#e5e2d9" font-size="16" letter-spacing=".8">TRANSLATION</text>
    <text x="206" y="454" fill="#4d565e" font-size="17">→</text>
    <text x="240" y="454" fill="#e5e2d9" font-size="16" letter-spacing=".8">ARCHITECTURE</text>
    <text x="408" y="454" fill="#4d565e" font-size="17">→</text>
    <text x="442" y="454" fill="#c6a46a" font-size="16" font-weight="600" letter-spacing=".8">EXECUTION</text>
  </g>

