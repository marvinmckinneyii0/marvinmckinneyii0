    <path d="M48 392H1152"/>
  </g>

  <g fill="#7993a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">
    <text x="68" y="80">INTERFACE / MM-01</text>
    <text x="976" y="80">STATE / OPEN</text>
    <text x="776" y="424">SEMANTIC FIELD / 01</text>
    <text x="68" y="424">PRIMARY FUNCTION</text>
  </g>

