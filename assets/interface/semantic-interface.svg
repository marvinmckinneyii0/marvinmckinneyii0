<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Marvin McKinney — AI systems architect and machine interlocutor</title>
  <desc id="description">A calm, near-monochrome computational interface with a sparse semantic field connecting strategy, architecture, context, and accountable action.</desc>

  <rect width="1200" height="520" fill="#080a0d"/>

  <g fill="none" stroke="#252b31" stroke-width="1">
    <path d="M48 48H1152"/>
    <path d="M48 472H1152"/>
